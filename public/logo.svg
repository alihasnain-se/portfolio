<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 76 362 256" width="362" height="256" role="img" aria-label="AH logo"><title>AH – Ali Hasnain</title>
<defs>
  <linearGradient id="face" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".25" stop-color="#e9edf1"/>
    <stop offset=".5" stop-color="#b9c2cc"/>
    <stop offset=".72" stop-color="#e3e8ed"/>
    <stop offset="1" stop-color="#8793a0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#6fb4ff" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#3d7bd8" stop-opacity=".18"/>
    <stop offset="1" stop-color="#3d7bd8" stop-opacity="0"/>
  </radialGradient>
  <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
    <feSpecularLighting in="b" surfaceScale="6" specularConstant="1.2" specularExponent="24" lighting-color="#ffffff" result="s">
      <fePointLight x="40" y="20" z="160"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="0.85" k4="0"/>
  </filter>
  <mask id="slash" maskUnits="userSpaceOnUse" x="-50" y="0" width="520" height="420">
    <rect x="-50" width="520" height="420" fill="#fff"/>
    <line x1="262" y1="342" x2="374" y2="228" stroke="#000" stroke-width="8"/>
  </mask>
  <g id="ah">
    <polygon points="60,310 114,310 215,108 215,90 170,90"/>
    <polygon points="144,250 215,250 215,220 159,220"/>
    <rect x="215" y="90" width="43" height="220"/>
    <polygon points="258,238 258,196 312,158 312,200"/>
    <polygon points="312,90 355,90 355,285 330,310 312,310"/>
  </g>
  <clipPath id="cp"><use href="#ah"/></clipPath>
  <g id="m">
    <g transform="translate(24,0) skewX(-8)" mask="url(#slash)">
      <use href="#ah" x="12.00" y="12.00" fill="#1c222c"/>
<use href="#ah" x="11.25" y="11.25" fill="#202630"/>
<use href="#ah" x="10.50" y="10.50" fill="#242a34"/>
<use href="#ah" x="9.75" y="9.75" fill="#292f39"/>
<use href="#ah" x="9.00" y="9.00" fill="#2d333d"/>
<use href="#ah" x="8.25" y="8.25" fill="#313741"/>
<use href="#ah" x="7.50" y="7.50" fill="#363c46"/>
<use href="#ah" x="6.75" y="6.75" fill="#3a404a"/>
<use href="#ah" x="6.00" y="6.00" fill="#3f454f"/>
<use href="#ah" x="5.25" y="5.25" fill="#434953"/>
<use href="#ah" x="4.50" y="4.50" fill="#474d57"/>
<use href="#ah" x="3.75" y="3.75" fill="#4c525c"/>
<use href="#ah" x="3.00" y="3.00" fill="#505660"/>
<use href="#ah" x="2.25" y="2.25" fill="#545a64"/>
<use href="#ah" x="1.50" y="1.50" fill="#595f69"/>
<use href="#ah" x="0.75" y="0.75" fill="#5d636d"/>

      <g filter="url(#bevel)">
        <use href="#ah" fill="url(#face)"/>
        <g clip-path="url(#cp)">
          <polygon points="40,330 120,330 300,60 220,60" fill="url(#sweep)" opacity=".55"/>
        </g>
      </g>
      <use href="#ah" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1"/>
    </g>
  </g>
</defs>
<use href="#m"/></svg>